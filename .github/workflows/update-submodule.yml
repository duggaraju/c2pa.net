name: Update c2pa-rs Submodule

on:
  schedule:
    # Run once every day
    - cron: '0 0 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific c2pa-c-ffi tag to update to (e.g., c2pa-c-ffi-v0.62.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_VERSION: "10.0.x"
  RUST_VERSION: "1.88.0"
  NODE_VERSION: "24"

jobs:
  check-and-update:
    if: github.event_name != 'pull_request'
    name: Check for new c2pa-c-ffi tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18

      - name: Get current submodule commit
        id: current
        run: |
          cd c2pa-rs
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Try to find if current commit has a c2pa-c-ffi tag
          CURRENT_TAG=$(git tag --points-at HEAD | grep '^c2pa-c-ffi-v' | sort -V | tail -1 || echo "")
          echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "Current submodule commit: $CURRENT_COMMIT"
          echo "Current tag (if any): $CURRENT_TAG"

      - name: Find latest c2pa-c-ffi tag
        id: latest
        run: |
          cd c2pa-rs
          git fetch --tags origin

          # Get the latest c2pa-c-ffi tag
          LATEST_TAG=$(git tag -l 'c2pa-c-ffi-v*' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No c2pa-c-ffi tags found"
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest c2pa-c-ffi tag: $LATEST_TAG"

          # Get the commit for this tag
          LATEST_COMMIT=$(git rev-list -n 1 "$LATEST_TAG")
          echo "commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          echo "Latest tag commit: $LATEST_COMMIT"

      - name: Use manual tag if provided
        id: target
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.tag }}"
            echo "Using manually specified tag: $TARGET_TAG"
          else
            TARGET_TAG="${{ steps.latest.outputs.tag }}"
            echo "Using latest discovered tag: $TARGET_TAG"
          fi

          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

          # Verify the tag exists
          cd c2pa-rs
          if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TARGET_TAG does not exist"
            exit 1
          fi

          TARGET_COMMIT=$(git rev-list -n 1 "$TARGET_TAG")
          echo "commit=$TARGET_COMMIT" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check
        run: |
          CURRENT="${{ steps.current.outputs.commit }}"
          TARGET="${{ steps.target.outputs.commit }}"

          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Submodule is already at the target tag ${{ steps.target.outputs.tag }}"
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "Update needed from ${{ steps.current.outputs.tag || steps.current.outputs.commit }} to ${{ steps.target.outputs.tag }}"
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update submodule
        id: update
        if: steps.check.outputs.needed == 'true'
        run: |
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          BRANCH_NAME="update-c2pa-rs-${TARGET_TAG}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$DEFAULT_BRANCH" ]; then
            DEFAULT_BRANCH="main"
          fi

          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Create or reset the branch from the default branch to avoid non-fast-forward push issues
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"

          # Update the submodule to the target tag
          cd c2pa-rs
          git fetch --tags origin
          git checkout "$TARGET_TAG"
          cd ..

          # Extract version number from tag (e.g., c2pa-c-ffi-v0.76.0 -> 0.76.0)
          VERSION=$(echo "$TARGET_TAG" | sed 's/^c2pa-c-ffi-v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Update the c2pa-rs badge in README.md
          sed -i "s|\[!\[c2pa-rs\](https://img.shields.io/badge/c2pa--rs-[^-]*-informational)\](https://github.com/contentauth/c2pa-rs/releases/tag/[^)]*)|[![c2pa-rs](https://img.shields.io/badge/c2pa--rs-${VERSION}-informational)](https://github.com/contentauth/c2pa-rs/releases/tag/${TARGET_TAG})|" README.md

          # Export the updated Rust schemas and regenerate the committed C# models.
          RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-A unused-imports" dotnet msbuild lib/ContentAuthenticity.csproj /t:GenerateModels /p:Configuration=Release /p:ForceGenerateModels=true /nodeReuse:false

          # Stage the submodule change, README update, and generated models.
          git add README.md
          git add lib/Schema
          git add -f c2pa-rs

          # Check if there are changes to commit
          if git diff --cached --ignore-submodules=none --quiet -- README.md lib/Schema c2pa-rs; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit the change
          git commit -m "Update c2pa-rs submodule to $TARGET_TAG"

          # Push the branch (force-with-lease to update existing branch safely)
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.check.outputs.needed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetTag = '${{ steps.target.outputs.tag }}';
            const branchName = '${{ steps.update.outputs.branch }}';
            const currentTagFromOutput = '${{ steps.current.outputs.tag }}';
            const currentTag = currentTagFromOutput || 'unknown';

            const title = `Update c2pa-rs submodule to ${targetTag}`;
            const body = `## Submodule Update

            This PR updates the \`c2pa-rs\` submodule to the latest C FFI release.

            **Target Tag:** \`${targetTag}\`
            **Previous Tag:** \`${currentTag}\`
            **Previous Commit:** \`${{ steps.current.outputs.commit }}\`
            **New Commit:** \`${{ steps.target.outputs.commit }}\`

            ### Changes

            This automated update tracks the upstream c2pa-rs C FFI releases and regenerates the committed .NET schema models.

            ### Checklist

            - [ ] Review the [c2pa-rs release notes](https://github.com/contentauth/c2pa-rs/releases/tag/${targetTag})
            - [ ] Review generated model changes under lib/Schema
            - [ ] Build and test the changes
            - [ ] Verify native bindings compatibility
            - [ ] Update any related documentation if needed

            ---
            *This PR was automatically created by the [Update c2pa-rs Submodule workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*`;

            try {
              // Check if a PR already exists for this branch
              const { data: existingPRs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branchName}`,
                state: 'open'
              });

              if (existingPRs.length > 0) {
                console.log(`PR already exists: #${existingPRs[0].number}`);
                return;
              }

              // Create the PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: branchName,
                base: context.payload.repository.default_branch || 'main',
                body: body
              });

              console.log(`Created PR #${pr.number}: ${pr.html_url}`);

              // Prefer linear history by requesting auto-merge with rebase.
              // This will take effect when branch protection requirements are satisfied.
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: REBASE
                    }) {
                      pullRequest {
                        number
                      }
                    }
                  }`,
                  { pullRequestId: pr.node_id }
                );
                console.log(`Enabled auto-merge (REBASE) for PR #${pr.number}`);
              } catch (autoMergeError) {
                console.log(`Could not enable auto-merge with REBASE for PR #${pr.number}: ${autoMergeError.message}`);
              }

              // Add labels to the PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['dependencies', 'submodule-update', 'automated']
              });

            } catch (error) {
              console.error('Error creating PR:', error);
              throw error;
            }

  tag-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'update-c2pa-rs-c2pa-c-ffi-v') &&
      contains(github.event.pull_request.labels.*.name, 'submodule-update')
    name: Tag merged submodule update
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release tag
        id: release
        run: |
          git -C c2pa-rs fetch --tags origin
          UPSTREAM_TAG=$(git -C c2pa-rs tag --points-at HEAD --list 'c2pa-c-ffi-v*' | sort -V | tail -1)

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "The merged submodule commit does not have a c2pa-c-ffi release tag"
            exit 1
          fi

          VERSION=${UPSTREAM_TAG#c2pa-c-ffi-v}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Cannot derive a valid release version from $UPSTREAM_TAG"
            exit 1
          fi

          RELEASE_TAG="v$VERSION"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git fetch --tags origin

          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
              echo "Release tag $RELEASE_TAG already points to $TAG_COMMIT"
              exit 1
            fi

            echo "Release tag $RELEASE_TAG already exists on this commit"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Events created with GITHUB_TOKEN do not start another workflow, so
      # explicitly run the release pipeline using the newly created tag ref.
      - name: Start release workflow
        if: steps.release.outputs.created == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-cd.yml',
              ref: process.env.RELEASE_TAG
            });
            console.log(`Started CI/CD for ${process.env.RELEASE_TAG}`);
