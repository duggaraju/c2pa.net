name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  RUST_VERSION: "1.88.0"
  RUSTFLAGS: "-A unused-imports"
  BASE_VERSION: "0.4.0"

jobs:
  generate-version:
    name: Generate Build Version
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: set_version
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = process.env.GITHUB_REF || '';
            let baseVersion = process.env.BASE_VERSION || '0.4.0';
            let version = '';

            // If triggered by a tag, use the tag version (strip leading 'v')
            if (ref && ref.startsWith('refs/tags/')) {
              version = ref.replace('refs/tags/','').replace(/^v/,'');
            } else {
              // Try to discover the most recent tag in the repo and use it as the base
              try {
                const { execSync } = require('child_process');
                const latestTag = execSync('git describe --tags --abbrev=0').toString().trim();
                if (latestTag) {
                  baseVersion = latestTag.replace(/^v/,'');
                }
              } catch (e) {
                // no tags available or git not present; fall back to BASE_VERSION
              }

              const runNumber = process.env.GITHUB_RUN_NUMBER || '0';
              const sha = (process.env.GITHUB_SHA || '').slice(0,8);
              const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
              version = `${baseVersion}-ci-${date}.${runNumber}.${sha}`;
            }
            core.setOutput('version', version);

  # Build matrix for different platforms
  build-and-test:
    name: Build and Test
    needs: generate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            build_arm64: true
            package: true
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            build_arm64: true
            package: true
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            build_arm64: false
            package: false
          - runner: macos-latest
            platform: macos
            arch: arm64
            build_arm64: false
            package: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true

      - name: Setup Node.js
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust toolchain for ARM64
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install Rust toolchain for ARM64
        if: matrix.platform == 'windows'
        run: rustup target add aarch64-pc-windows-msvc

      # Cache .NET dependencies
      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet
          key: ${{ matrix.platform }}-${{ matrix.arch }}-Release-dotnet-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-Release-dotnet-

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 ${{ matrix.arch == 'x64' && 'gcc-aarch64-linux-gnu' || '' }}

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install llvm

      # Restore .NET dependencies
      - name: Restore dependencies
        run: dotnet restore /p:HostArchitectureName=${{ matrix.arch }} && dotnet tool restore

      # Package-producing x64 jobs cross-build ARM64; the ARM64 job tests natively.
      - name: Build solution
        run: |
          dotnet build -m --configuration Release --no-restore --verbosity normal /p:HostArchitectureName=${{ matrix.arch }} /p:BuildArm64=${{ matrix.build_arm64 }}

      - name: Verify generated schema models are current
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          dotnet msbuild lib/ContentAuthenticity.csproj /t:GenerateModels /p:Configuration=Release /p:ForceGenerateModels=true /nodeReuse:false
          git diff --exit-code -- lib/Schema

      - name: Run tests
        run: |
          dotnet test --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}-Release
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml

      - name: Upload coverage to Codecov
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: codecov/codecov-action@v7
        with:
          files: "**/TestResults/**/coverage.cobertura.xml"
          fail_ci_if_error: false

      - name: Create NuGet packages
        if: matrix.package
        run: |
          dotnet pack lib/ContentAuthenticity.csproj --configuration Release --no-build --output ./artifacts/packages --include-source -p:BuildArm64=true -p:PackageVersion=${{ needs.generate-version.outputs.build_version }}

      # Upload NuGet packages as artifacts
      - name: Upload NuGet packages
        if: matrix.package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/packages/*.nupkg

  # Publish job that runs only on main branch pushes or releases
  publish:
    name: Publish NuGet Package
    needs: [build-and-test, generate-version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-packages-*
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure zip/unzip exist
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip

      - name: Merge runtime nupkgs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ./merged

          mapfile -t pkgs < <(find ./packages -name '*.nupkg' ! -name '*.symbols.nupkg' -print | sort)

          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No NuGet packages found in ./packages"
            echo "Contents of ./packages:"
            find ./packages -type f | head -20
            exit 1
          fi

          base_pkg="${pkgs[0]}"
          base_name="$(basename "$base_pkg")"
          workdir="$(mktemp -d)"

          echo "Merging ${#pkgs[@]} package(s) into $base_name"
          unzip "$base_pkg" -d "$workdir/base"

          # Merge all other packages' runtimes folders (runtimes/<rid>/native/*)
          for pkg in "${pkgs[@]:1}"; do
            echo "Merging $(basename "$pkg")..."
            tmp="$workdir/tmp"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            unzip -q "$pkg" -d "$tmp"

            if [ -d "$tmp/runtimes" ]; then
              mkdir -p "$workdir/base/runtimes"
              cp -a "$tmp/runtimes/." "$workdir/base/runtimes/"
            fi
          done

          expected_native_files=(
            "runtimes/linux-x64/native/libc2pa_c.so"
            "runtimes/linux-arm64/native/libc2pa_c.so"
            "runtimes/osx-arm64/native/libc2pa_c.dylib"
            "runtimes/win-x64/native/c2pa_c.dll"
            "runtimes/win-arm64/native/c2pa_c.dll"
          )

          missing_native_files=()
          for native_file in "${expected_native_files[@]}"; do
            if [ ! -f "$workdir/base/$native_file" ]; then
              missing_native_files+=("$native_file")
            fi
          done

          if [ ${#missing_native_files[@]} -ne 0 ]; then
            echo "Merged package is missing required native libraries:"
            printf '  %s\n' "${missing_native_files[@]}"
            exit 1
          fi

          echo "Verified native libraries for all supported RIDs."

          # Create merged package
          pushd "$workdir/base" >/dev/null
          zip -qr "$workdir/$base_name" .
          popd >/dev/null

          mv "$workdir/$base_name" "./merged/$base_name"
          rm -rf "$workdir"

          echo "Merged package created: ./merged/$base_name"
          echo "Final merged nupkg file list:"
          unzip -Z1 "./merged/$base_name" | sort

          echo "MERGED_NUPKG=$PWD/merged/$base_name" >> "$GITHUB_ENV"

      - name: Publish to NuGet.org
        shell: bash
        run: |
          if [ -z "${MERGED_NUPKG:-}" ]; then
            echo "MERGED_NUPKG env var not set"
            exit 1
          fi

          echo "Publishing merged package to NuGet.org: $MERGED_NUPKG"
          dotnet nuget push "$MERGED_NUPKG" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.MERGED_NUPKG }}

  # Security + code quality checks
  security-and-quality:
    name: Security and Code Quality
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      # .NET formatting and analysis
      - name: Install dotnet format tool
        run: dotnet tool install -g dotnet-format

      - name: Check .NET formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
